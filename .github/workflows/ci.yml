name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: bufferiq
          POSTGRES_PASSWORD: bufferiq_dev
          POSTGRES_DB: bufferiq_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip wheel setuptools
        cd backend
        pip install -r requirements.txt

    - name: Run black
      run: |
        cd backend
        python -m black --check .

    - name: Run ruff
      run: |
        cd backend
        python -m ruff check . --fix

    - name: Run mypy
      run: |
        cd backend
        python -m mypy bufferiq/ --strict --ignore-missing-imports

    - name: Run tests
      env:
        DATABASE_URL: sqlite:///:memory:
        REDIS_URL: redis://localhost:6379
        BUFFER_API_KEY: test_key_for_ci
        ENVIRONMENT: testing
      run: |
        cd backend
        python -m pytest tests/ -v --cov=bufferiq --cov-report=xml --cov-report=term-missing -m "not integration" || python -m pytest tests/ -v --cov=bufferiq --cov-report=xml --cov-report=term-missing

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: backend/coverage.xml
        fail_ci_if_error: false