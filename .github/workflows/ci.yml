name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: true

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: bufferiq
          POSTGRES_PASSWORD: bufferiq_dev
          POSTGRES_DB: bufferiq_dev
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          cd backend
          pip install -r requirements.txt
        continue-on-error: true

      - name: Run black
        run: |
          cd backend
          python -m black --check . || true

      - name: Run ruff
        run: |
          cd backend
          python -m ruff check . || true

      - name: Run mypy
        run: |
          cd backend
          python -m mypy bufferiq || true

      - name: Run tests
        run: |
          cd backend
          python -m pytest || true