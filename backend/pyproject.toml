[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bufferiq"
version = "0.1.0"
description = "The Intelligence Layer for Buffer - ML-powered engagement prediction and content optimization"
authors = [{name = "Manav Gandhi", email = "27manavgandhi@gmail.com"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["buffer", "social-media", "machine-learning", "engagement-prediction", "content-optimization"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi>=0.104.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.23",
    "aiohttp>=3.9.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
]

[project.urls]
Homepage = "https://github.com/27manavgandhi/BufferIQ"
Documentation = "https://github.com/27manavgandhi/BufferIQ/tree/main/docs"
Repository = "https://github.com/27manavgandhi/BufferIQ"
Issues = "https://github.com/27manavgandhi/BufferIQ/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["bufferiq*"]
exclude = ["tests*"]

# -------------------------
# BLACK (only once ✅)
# -------------------------
[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
  | \.eggs
  | \.mypy_cache
  | \.tox
)/
'''

# -------------------------
# RUFF (merged ✅)
# -------------------------
[tool.ruff]
line-length = 88
target-version = "py311"

select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]

ignore = [
    "E501",
    "B008",
    "C901",
    "UP007",  # 👈 added here
]

exclude = ["alembic"]  # 👈 added here

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

# -------------------------
# MYPY (merged ✅)
# -------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# -------------------------
# PYTEST
# -------------------------
[tool.pytest.ini_options]
minversion = "7.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=bufferiq",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

# -------------------------
# COVERAGE
# -------------------------
[tool.coverage.run]
source = ["bufferiq"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
