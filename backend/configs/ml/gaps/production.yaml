# Gap Analysis Configuration - Production

environment: production

gap_analysis:
  min_topic_posts: 5
  max_topics: 100
  similarity_threshold: 0.35
  lookback_days_default: 90
  
topic_extraction:
  ngram_range: [1, 3]
  max_features: 2000
  stop_words: english
  
coverage:
  saturation_threshold: 25
  balance_weight: 0.75
  
detection:
  critical_threshold: 85
  important_threshold: 65
  moderate_threshold: 45
  
competitors:
  max_competitors: 20
  min_posts_required: 20
  
recommendations:
  default_count: 30
  max_count: 100
  min_priority_score: 60
  
calendar:
  max_weeks: 26
  max_posts_per_week: 10
  default_posting_time: "09:00"
  
serp:
  difficulty_threshold: 75
  opportunity_threshold: 65
  
benchmarking:
  industry_averages:
    technology:
      engagement_rate: 0.048
      posts_per_week: 3.5
    marketing:
      engagement_rate: 0.055
      posts_per_week: 4.2
      
scoring:
  weights:
    competitor_coverage: 0.25
    search_volume: 0.20
    trend_momentum: 0.25
    engagement_potential: 0.15
    strategic_fit: 0.15
    
caching:
  enabled: true
  ttl_seconds: 7200
  redis_host: ${REDIS_HOST}
  redis_port: ${REDIS_PORT}
  
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"