# Clustering Configuration for Day 22

clustering_optimizer:
  min_clusters: 2
  max_clusters: 10
  min_samples_per_cluster: 3
  evaluation_folds: 5
  random_state: 42

kmeans:
  n_init: 10
  max_iter: 300
  tol: 1e-4
  algorithm: "lloyd"
  random_state: 42
  performance_target_ms: 200

dbscan:
  eps: 0.5
  min_samples: 5
  metric: "euclidean"
  algorithm: "auto"
  performance_target_ms: 150

hierarchical:
  linkage: "ward"
  distance_threshold: None
  compute_full_tree: True
  performance_target_ms: 250

gmm:
  n_init: 10
  max_iter: 100
  reg_covar: 1e-6
  init_params: "kmeans"
  random_state: 42
  performance_target_ms: 300

# Quality thresholds
quality_thresholds:
  silhouette_min: 0.65
  stability_min: 0.70
  calinski_harabasz_min: 50.0
  davies_bouldin_max: 1.0

# Ensemble settings
ensemble:
  algorithms:
    - kmeans
    - hierarchical
    - gmm
  voting_method: "silhouette"
  min_consensus: 0.7