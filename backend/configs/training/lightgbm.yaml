experiment:
  experiment_name: "lightgbm_fast"
  description: "LightGBM model for fast training"
  use_cross_validation: false
  cv_folds: 5

data:
  target_column: "engagement_rate"
  platforms:
    - linkedin
    - twitter
    - bluesky
  min_samples: 100
  test_size: 0.2
  validation_size: 0.1
  time_based_split: true

model:
  model_type: "lightgbm"
  hyperparameters:
    n_estimators: 150
    max_depth: 7
    learning_rate: 0.05
    num_leaves: 31
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_samples: 20
    reg_alpha: 0.1
    reg_lambda: 0.1
    random_state: 42

training:
  max_epochs: 100
  early_stopping_patience: 10
  checkpoint_monitor: "val_r2"
  checkpoint_mode: "max"