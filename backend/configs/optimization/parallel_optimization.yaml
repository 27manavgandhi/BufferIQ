# Parallel XGBoost optimization using multiple workers
model_type: xgboost
strategy: optuna_parallel
sampler: tpe
pruner: median
n_trials: 200
n_workers: 4  # Number of parallel workers
n_trials_per_worker: 50  # Each worker runs 50 trials
timeout: 3600
direction: maximize
metric: r2
cv_folds: 5

# Optuna-specific configuration
study_name: xgboost_parallel_001
storage: sqlite:///outputs/optimizations/optuna_studies/xgboost_parallel_001.db

# Search space
search_space:
  learning_rate:
    type: float
    low: 0.01
    high: 0.3
    log: true
  
  max_depth:
    type: int
    low: 3
    high: 10
  
  n_estimators:
    type: int
    low: 100
    high: 500
    step: 50
  
  subsample:
    type: float
    low: 0.6
    high: 1.0
  
  colsample_bytree:
    type: float
    low: 0.6
    high: 1.0
  
  min_child_weight:
    type: int
    low: 1
    high: 10
  
  gamma:
    type: float
    low: 0.0
    high: 0.5
  
  reg_alpha:
    type: float
    low: 0.001
    high: 10.0
    log: true
  
  reg_lambda:
    type: float
    low: 0.001
    high: 10.0
    log: true

# Parallel-specific settings
parallel:
  timeout_per_worker: 900  # 15 minutes per worker
  max_retries: 3

# General settings
random_state: 42
verbose: 1

# Output configuration
output_dir: outputs/optimizations/parallel/xgboost_001
save_best_params: true
save_study: true
create_visualizations: true