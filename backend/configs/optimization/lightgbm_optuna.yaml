# LightGBM hyperparameter optimization with Optuna
model_type: lightgbm
strategy: optuna
sampler: tpe
pruner: median
n_trials: 100
timeout: 3600
direction: maximize
metric: r2
cv_folds: 5

# Optuna-specific configuration
study_name: lightgbm_optuna_001
storage: sqlite:///outputs/optimizations/optuna_studies/lightgbm_001.db

# Search space (LightGBM-specific parameters)
search_space:
  learning_rate:
    type: float
    low: 0.01
    high: 0.3
    log: true
  
  max_depth:
    type: int
    low: 3
    high: 10
  
  n_estimators:
    type: int
    low: 100
    high: 500
    step: 50
  
  num_leaves:
    type: int
    low: 20
    high: 150
  
  subsample:
    type: float
    low: 0.6
    high: 1.0
  
  colsample_bytree:
    type: float
    low: 0.6
    high: 1.0
  
  min_child_samples:
    type: int
    low: 10
    high: 100
  
  reg_alpha:
    type: float
    low: 0.001
    high: 10.0
    log: true
  
  reg_lambda:
    type: float
    low: 0.001
    high: 10.0
    log: true
  
  min_split_gain:
    type: float
    low: 0.0
    high: 1.0

# General settings
random_state: 42
verbose: 1

# Output configuration
output_dir: outputs/optimizations/optuna/lightgbm_001
save_best_params: true
save_study: true
create_visualizations: true