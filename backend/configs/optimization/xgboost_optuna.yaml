# XGBoost hyperparameter optimization with Optuna
model_type: xgboost
strategy: optuna
sampler: tpe  # Tree-structured Parzen Estimator
pruner: median  # Median pruner
n_trials: 100
timeout: 3600  # 1 hour in seconds
direction: maximize
metric: r2
cv_folds: 5

# Optuna-specific configuration
study_name: xgboost_optuna_001
storage: sqlite:///outputs/optimizations/optuna_studies/xgboost_001.db

# Search space (Optuna format)
search_space:
  learning_rate:
    type: float
    low: 0.01
    high: 0.3
    log: true
  
  max_depth:
    type: int
    low: 3
    high: 10
  
  n_estimators:
    type: int
    low: 100
    high: 500
    step: 50
  
  subsample:
    type: float
    low: 0.6
    high: 1.0
  
  colsample_bytree:
    type: float
    low: 0.6
    high: 1.0
  
  min_child_weight:
    type: int
    low: 1
    high: 10
  
  gamma:
    type: float
    low: 0.0
    high: 0.5
  
  reg_alpha:
    type: float
    low: 0.001
    high: 10.0
    log: true
  
  reg_lambda:
    type: float
    low: 0.001
    high: 10.0
    log: true

# General settings
random_state: 42
verbose: 1

# Output configuration
output_dir: outputs/optimizations/optuna/xgboost_001
save_best_params: true
save_study: true
create_visualizations: true